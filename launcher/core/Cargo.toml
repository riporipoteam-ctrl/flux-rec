[package]
name = "fluxrec-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Flux Rec launcher core: updates, BepInEx, bypass, launch logic"

[lib]
name = "fluxrec_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
dirs = "6"
zip = "2"
thiserror = "2"
futures-util = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
