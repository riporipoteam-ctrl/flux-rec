name: Build Flux Rec Launcher (Windows)

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './launcher/src-tauri -> target'

      # FIX 1: Install Tauri CLI locally (not global) — avoids Windows PATH
      # issues with `npm install -g` inside the same run block.
      - name: Install Tauri CLI (local devDependency)
        working-directory: launcher
        run: npm install --no-save @tauri-apps/cli@2

      # FIX 2: Use npx (local CLI) instead of global `tauri` binary.
      - name: Build with Tauri CLI
        working-directory: launcher
        run: npx tauri build --bundles nsis --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # FIX 3: Always show what was actually produced — no more silent
      # "succeeded but no exe" mysteries.
      - name: Debug - list build outputs
        if: always()
        shell: pwsh
        run: |
          echo "=== src-tauri/target/release/ ==="
          Get-ChildItem -Path "launcher/src-tauri/target/release/" -ErrorAction SilentlyContinue | ForEach-Object { echo $_.Name }
          echo ""
          echo "=== bundle/ (recursive) ==="
          Get-ChildItem -Path "launcher/src-tauri/target/release/bundle/" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { echo $_.FullName }

      # FIX 4: Safety net — direct cargo build guarantees fluxrec-launcher.exe
      # exists. If `tauri build` already compiled it, this is a fast no-op
      # (incremental). If tauri silently produced nothing, this fixes it.
      # The build.rs embeds frontend assets via tauri_build::build(), so the
      # raw exe is a fully functional standalone launcher.
      - name: Safety net - cargo build raw exe
        working-directory: launcher/src-tauri
        run: cargo build --release

      # FIX 5: Broad exe search — NSIS setup exe, any bundle exe, then raw exe.
      - name: Find executable
        id: find
        shell: pwsh
        run: |
          $exe = $null
          # 1. NSIS installer (Tauri v2 names it {product}_{version}_x64-setup.exe)
          $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/bundle/nsis/*setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          # 2. Any exe in the NSIS bundle dir
          if (-not $exe) {
            $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # 3. Any exe in any bundle subdir (msi uses .msi, but check anyway)
          if (-not $exe) {
            $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/bundle/*/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # 4. Raw cargo-built exe (from [[bin]] name = "fluxrec-launcher")
          if (-not $exe) {
            $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/fluxrec-launcher.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # 5. Last resort: any exe in release/ that isn't a build tool
          if (-not $exe) {
            $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "build_script*" } | Select-Object -First 1
          }
          if ($exe) {
            $sizeMB = [math]::Round($exe.Length / 1MB, 1)
            echo "found=true" >> $env:GITHUB_OUTPUT
            echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
            echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
            echo "Found: $($exe.FullName) ($sizeMB MB)"
          } else {
            echo "found=false" >> $env:GITHUB_OUTPUT
            echo "ERROR: No executable found after tauri build + cargo build!"
            exit 1
          }

      - name: Create Release
        if: steps.find.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Flux Rec Launcher ${{ github.ref_name }}'
          body: |
            Flux Rec Launcher — fresh v2 build.

            - 3 independent update channels (launcher, game, plugin)
            - Anti-wipe protection
            - Fail-soft offline mode
            - Plugin v2.0.1 with RRUI force-enable (Store crash fix)
          files: ${{ steps.find.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
