name: Build Flux Rec Launcher (Windows)

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './launcher/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: 'Flux Rec Launcher ${{ github.ref_name }}'
          releaseBody: |
            Flux Rec Launcher — fresh v2 build.
            
            - 3 independent update channels (launcher, game, plugin)
            - Anti-wipe protection
            - Fail-soft offline mode
          releaseDraft: false
          prerelease: false

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxrec-launcher-windows
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
