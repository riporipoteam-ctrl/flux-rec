name: Build Flux Rec Launcher (Windows)

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: launcher
        run: npm install

      - name: Build with Tauri CLI
        working-directory: launcher
        run: |
          npm install -g @tauri-apps/cli@2
          tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer
        id: find
        shell: pwsh
        run: |
          # Try NSIS bundle first, then fallback to raw exe
          $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            echo "NSIS not found, looking for raw exe..."
            $exe = Get-ChildItem -Path "launcher/src-tauri/target/release/*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          }
          if ($exe) {
            echo "found=true" >> $env:GITHUB_OUTPUT
            echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
            echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
            echo "Found: $($exe.FullName)"
          } else {
            echo "found=false" >> $env:GITHUB_OUTPUT
            echo "No executable found!"
            Get-ChildItem -Path "launcher/src-tauri/target/release/" | ForEach-Object { echo $_.FullName }
            exit 1
          }

      - name: Create Release
        if: steps.find.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Flux Rec Launcher ${{ github.ref_name }}'
          body: |
            Flux Rec Launcher — fresh v2 build.

            - 3 independent update channels (launcher, game, plugin)
            - Anti-wipe protection
            - Fail-soft offline mode
            - Plugin v2.0.1 with RRUI force-enable (Store crash fix)
          files: ${{ steps.find.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
